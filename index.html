      ${isHost
        ? `<button class="btn" id="startOnlineBtn" ${canStart ? '' : 'disabled'}>START MATCH</button>`
        : `<button class="btn" id="readyBtn">${iAmReady ? 'CANCEL READY' : "I'M READY"}</button>`
      }
      <button class="btn secondary" id="leaveBtn">LEAVE</button>
    </div>
    <p class="hint">
      ${isHost
        ? 'Wait for all players to ready up, then hit START.'
        : "Click I'M READY when you're set."}
    </p>
  `;

  wireLobby();
  if (gameState === 'menu') overlay.classList.add('show');
}

function wireLobby() {
  const copyLink = document.getElementById('copyLink');
  if (copyLink) copyLink.onclick = () => {
    const link = `${location.origin}${location.pathname}?room=${net.roomCode}`;
    navigator.clipboard.writeText(link).then(() => {
      copyLink.textContent = '✓ Copied';
      setTimeout(() => { copyLink.textContent = '📋 Copy Link'; }, 1200);
    }).catch(() => {});
  };
  const copyCode = document.getElementById('copyCode');
  if (copyCode) copyCode.onclick = () => {
    navigator.clipboard.writeText(net.roomCode).then(() => {
      copyCode.textContent = '✓ Copied';
      setTimeout(() => { copyCode.textContent = 'Copy Code'; }, 1200);
    }).catch(() => {});
  };

  const roundRow = document.getElementById('lobbyRoundRow');
  if (roundRow && net.isHost) {
    roundRow.querySelectorAll('[data-rounds]').forEach(b => {
      b.onclick = () => {
        const n = parseInt(b.dataset.rounds, 10);
        hostSetRounds(n);
      };
    });
  }

  const chatInput = document.getElementById('lobbyChatInput');
  const sendChat = () => {
    if (!chatInput) return;
    const txt = chatInput.value.trim();
    if (!txt) return;
    chatInput.value = '';
    if (net.isHost) {
      const me = onlinePlayers[net.mySlot];
      addChat({ name: me.name, text: txt });
      hostBroadcastChat({ name: me.name, text: txt });
    } else {
      netSendToHost({ t: 'chat', text: txt });
    }
  };
  const chatSendBtn = document.getElementById('lobbyChatSend');
  if (chatSendBtn) chatSendBtn.onclick = sendChat;
  if (chatInput) chatInput.onkeydown = e => { if (e.key === 'Enter') sendChat(); };

  document.querySelectorAll('[data-kick]').forEach(b => {
    b.onclick = () => {
      if (!net.isHost) return;
      const slot = parseInt(b.dataset.kick, 10);
      const target = onlinePlayers.find(p => p.slot === slot);
      if (!target) return;
      const tok = target.token;
      if (net.conns[tok]) {
        netSendTo(net.conns[tok], { t: 'kick' });
        setTimeout(() => { try { net.conns[tok].close(); } catch(e){} delete net.conns[tok]; }, 100);
      }
      const idx = onlinePlayers.findIndex(p => p.token === tok);
      if (idx >= 0) onlinePlayers.splice(idx, 1);
      onlinePlayers.forEach((p, i) => { p.slot = i; });
      hostNotifyAll(`${target.name} was kicked by host`, 'danger');
      addChat({ sys: true, text: `${target.name} was kicked` });
      hostBroadcastLobby();
      paintLobby();
    };
  });

  const leaveBtn = document.getElementById('leaveBtn');
  if (leaveBtn) leaveBtn.onclick = () => {
    if (!net.isHost) netSendToHost({ t: 'bye' });
    leaveRoom();
    gameState = 'menu';
    chatToggle.classList.remove('show');
    showMenu();
  };

  const startBtn = document.getElementById('startOnlineBtn');
  if (startBtn) startBtn.onclick = () => { initAudio(); hostStartMatch(); };

  const readyBtn = document.getElementById('readyBtn');
  if (readyBtn) readyBtn.onclick = () => {
    const me = onlinePlayers.find(p => p.slot === net.mySlot);
    if (!me) return;
    const newReady = !me.ready;
    netSendToHost({ t: 'ready', ready: newReady });
    me.ready = newReady;
    paintLobby();
  };
}

function showMenu() {
  gameState = 'menu';
  paintMenu();
}

/* =========================================================
   BOOT
   ========================================================= */
resetPens();
mode = 'cpu';
paintMenu();
requestAnimationFrame(loop);

window.addEventListener('keydown', (e) => {
  if (e.key === 'm' || e.key === 'M') muted = !muted;
});

})();
</script>
</body>
</html>
