}

function simulate(shooterIdx, targetIdx, dir, speed, hitPoint) {
  const sim = pens.map(p => ({ ...p }));
  flick(sim[shooterIdx], dir, speed, hitPoint);
  const t0   = distToEdge(pens[targetIdx]);
  const own0 = distToEdge(pens[shooterIdx]);
  simMode = true;
  try {
    for (let i = 0; i < 450; i++) {
      physicsStep(sim, 1/240);
      if (sim.some(p => isOut(p))) break;
      if (allSettled(sim)) break;
    }
  } finally { simMode = false; }
  const shooterOut = isOut(sim[shooterIdx]);
  const targetOut  = isOut(sim[targetIdx]);
  if (shooterOut && targetOut) return -4000;
  if (shooterOut) return -10000;
  if (targetOut) return 10000;
  const t1   = distToEdge(sim[targetIdx]);
  const own1 = distToEdge(sim[shooterIdx]);
  const moved = Math.hypot(sim[targetIdx].x - pens[targetIdx].x, sim[targetIdx].y - pens[targetIdx].y);
  return (t0 - t1) * 3 - (own0 - own1) * 2 + (moved > 8 ? 150 : 0);
}
function doAIShot() {
  let shooter = -1, target = -1;
  for (let i = 0; i < pens.length; i++) {
    if (pens[i].isCpu && !pens[i].out) shooter = i;
    else if (!pens[i].isCpu && !pens[i].out && target === -1) target = i;
  }
  if (shooter === -1) shooter = turn;
  if (target === -1) target = (shooter + 1) % pens.length;
  const pen = pens[shooter], opp = pens[target];
  const baseAngle = Math.atan2(opp.y - pen.y, opp.x - pen.x);
  const angles = [-0.14, 0, 0.14], speeds = [800, 1050, 1200], offsetFactors = [-0.85, 0, 0.85];
  const minT = -COM_FROM_CAP, maxT = PEN_LEN - COM_FROM_CAP;
  const midT = (minT + maxT) / 2;
  let best = null, bestScore = -Infinity;
  outer:
  for (const da of angles) for (const sp of speeds) for (const of of offsetFactors) {
    const a = baseAngle + da;
    const dir = { x: Math.cos(a), y: Math.sin(a) };
    const t = midT + of * (maxT - midT);
    const hit = { x: pen.x + Math.cos(pen.angle) * t, y: pen.y + Math.sin(pen.angle) * t };
    const sc = simulate(shooter, target, dir, sp, hit);
    if (sc > bestScore) {
      bestScore = sc;
      best = { dir, sp, hit, shooter };
      if (sc > 9000) break outer;
    }
  }
  const noiseA = { easy: 0.18, normal: 0.07, hard: 0.018 }[difficulty];
  const noiseS = { easy: 230, normal: 95, hard: 28 }[difficulty];
  const a  = Math.atan2(best.dir.y, best.dir.x) + rand(-noiseA, noiseA);
  const sp = clamp(best.sp + rand(-noiseS, noiseS), 300, MAX_SPEED);
  flick(pens[best.shooter], { x: Math.cos(a), y: Math.sin(a) }, sp, best.hit);
  sfxFlick(sp / MAX_SPEED);
  gameState = 'moving';
  settleTimer = 0;
}

function update(dt) {
  const active = (gameState === 'aiming' || gameState === 'moving' ||
                  gameState === 'ai' || gameState === 'roundend');
  if (active) {
    acc += dt;
    let guard = 0;
    while (acc >= FIXED && guard < 80) {
      for (const p of pens) { p.px = p.x; p.py = p.y; p.pa = p.angle; }
      physicsStep(pens, FIXED);
      acc -= FIXED;
      guard++;
      for (const p of pens) {
        if (!p.out && isOut(p)) {
          p.out = true;
          if (!simMode) sfxTone(200, 0.28, 0.06, 'sawtooth');
        }
      }
    }
    renderAlpha = clamp(acc / FIXED, 0, 1);
  } else {
    renderAlpha = 1;
  }
  // ease out any network snap corrections
  const ck = Math.exp(-dt * 14);
  for (const p of pens) {
    if (p.ox || p.oy || p.oa) {
      p.ox *= ck; p.oy *= ck; p.oa *= ck;
      if (Math.abs(p.ox) + Math.abs(p.oy) + Math.abs(p.oa) < 0.02) { p.ox = p.oy = p.oa = 0; }
    }
  }
  if (gameState === 'moving' && !roundOver) {
    if (allSettled(pens)) {
      settleTimer += dt;
      // Reduced to 0.1s so it transitions instantly when the pen stops
      if (settleTimer > 0.1) {
        settleTimer = 0;
        if (mode === 'online') { if (net.isHost) resolveShot(); }
        else resolveShot();
      }
    } else settleTimer = 0;
  }
  if (gameState === 'ai') {
    aiTimer -= dt;
    if (aiTimer <= 0) doAIShot();
  }
  if (gameState === 'roundend') {
    roundEndTimer -= dt;
    if (roundEndTimer <= 0) {
      if (mode === 'online') { if (net.isHost) afterRound(); }
      else afterRound();
    }
  }
  if (mode === 'online' && net.isHost && gameState === 'aiming') {
    if (performance.now() > turnDeadline) hostTimeout();
  }
  
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.life -= dt;
    if (s.life <= 0) sparks.splice(i, 1);
  }
}

function roundRect(c, x, y, w, h, r) {
  r = Math.min(r, w/2, h/2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y,     x + w, y + h, r);
  c.arcTo(x + w, y + h, x,     y + h, r);
  c.arcTo(x,     y + h, x,     y,     r);
  c.arcTo(x,     y,     x + w, y,     r);
  c.closePath();
}

function buildDeskCache() {
  const w = DESK.w, h = DESK.h;
  const cache = document.createElement('canvas');
  cache.width  = w * DPR;
  cache.height = h * DPR;
  const c = cache.getContext('2d');
  c.scale(DPR, DPR);
  roundRect(c, 0, 0, w, h, 18);
  c.clip();

  const g = c.createLinearGradient(0, 0, w * 0.65, h);
  g.addColorStop(0,    '#ccad80');
  g.addColorStop(0.42, '#bb945f');
  g.addColorStop(1,    '#9e7545');
  c.fillStyle = g;
  c.fillRect(0, 0, w, h);

  for (let i = 0; i < 30; i++) {
    const y = (i / 30) * h + Math.sin(i * 2.3) * 5;
    c.beginPath();
    c.moveTo(0, y);
    c.bezierCurveTo(
      w * 0.30, y + Math.sin(i * 1.3) * 9,
      w * 0.70, y - Math.cos(i * 0.9) * 9,
      w,        y + Math.sin(i * 1.7) * 5
    );
    c.strokeStyle = `rgba(80, 52, 22, ${0.05 + (i % 3) * 0.02})`;
    c.lineWidth = 1 + (i % 3);
    c.stroke();
  }

  const vg = c.createRadialGradient(w/2, h/2, h*0.15, w/2, h/2, w*0.72);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(60,35,12,0.34)');
  c.fillStyle = vg;
  c.fillRect(0, 0, w, h);

  deskCache = cache;
}

function drawDesk(c) {
  if (!deskCache) buildDeskCache();

  c.save();
  c.shadowColor = 'rgba(0,0,0,0.65)';
  c.shadowBlur = 45 * DPR;          // shadowBlur ignores transforms
  c.shadowOffsetY = 20 * DPR;
  c.fillStyle = '#5e4223';
  roundRect(c, DESK.x, DESK.y, DESK.w, DESK.h, 18);
  c.fill();
  c.restore();

  c.drawImage(deskCache, DESK.x, DESK.y, DESK.w, DESK.h);

  c.strokeStyle = 'rgba(255,255,255,0.18)';
  c.lineWidth = 2;
  roundRect(c, DESK.x+1.5, DESK.y+1.5, DESK.w-3, DESK.h-3, 16.5);
  c.stroke();

  c.strokeStyle = 'rgba(50,30,12,0.62)';
  c.lineWidth = 3;
  roundRect(c, DESK.x, DESK.y, DESK.w, DESK.h, 18);
  c.stroke();
}

function buildScene() {
  const sc = document.createElement('canvas');
  sc.width = canvas.width; sc.height = canvas.height;
  const c = sc.getContext('2d');
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  const bg = c.createRadialGradient(W/2, H*0.2, 60, W/2, H*0.5, W*0.85);
  bg.addColorStop(0, '#1c1f2b');
  bg.addColorStop(1, '#0a0b10');
  c.fillStyle = bg;
  c.fillRect(0, 0, W, H);
  drawDesk(c);
  sceneCache = sc;
}

const SPR_PAD = 28;
function buildPenSprites() {
  penSprites.length = 0;
  const L = PEN_LEN, Wd = PEN_WID, capLen = 20;
  const sw = L + SPR_PAD * 2, sh = Wd + SPR_PAD * 2;
  const OFF = 3000;   // draw shape far off-canvas so only its shadow lands on the sprite
  const make = () => {
    const cv = document.createElement('canvas');
    cv.width = Math.ceil(sw * DPR); cv.height = Math.ceil(sh * DPR);
    const g = cv.getContext('2d');
    g.setTransform(DPR, 0, 0, DPR, sw/2 * DPR, sh/2 * DPR);
    return { cv, g };
  };
  for (const st of PALETTE) {
    // soft drop shadow (rotates with pen; world offset is applied at draw time)
    const S = make();
    S.g.shadowColor = 'rgba(0,0,0,0.38)';
    S.g.shadowBlur = 8 * DPR; S.g.shadowOffsetX = OFF; S.g.shadowOffsetY = 0;
    S.g.fillStyle = '#000';
    roundRect(S.g, -L/2 - OFF / DPR, -Wd/2, L, Wd, Wd/2);
    S.g.fill();

    // active glow
    const G = make();
    G.g.shadowColor = st.body;
    G.g.shadowBlur = 20 * DPR; G.g.shadowOffsetX = OFF; G.g.shadowOffsetY = 0;
    G.g.fillStyle = '#fff';
    roundRect(G.g, -L/2 - OFF / DPR, -Wd/2, L, Wd, Wd/2);
    G.g.fill();

    // body
    const B = make(), g = B.g;
    const bg = g.createLinearGradient(0, -Wd/2, 0, Wd/2);
    bg.addColorStop(0, st.light); bg.addColorStop(0.35, st.body); bg.addColorStop(1, st.dark);
    g.fillStyle = bg;
    roundRect(g, -L/2, -Wd/2, L, Wd, Wd/2); g.fill();
    const capG = g.createLinearGradient(0, -Wd/2, 0, Wd/2);
    capG.addColorStop(0, st.light); capG.addColorStop(0.35, st.cap); capG.addColorStop(1, st.dark);
    g.fillStyle = capG;
    roundRect(g, -L/2, -Wd/2, capLen, Wd, Wd/2); g.fill();
    g.fillStyle = 'rgba(0,0,0,0.3)';
    g.fillRect(-L/2 + capLen - 1, -Wd/2, 1.3, Wd);
    g.fillStyle = 'rgba(255,255,255,0.42)';
    roundRect(g, -L/2 + 4, -Wd/2 - 1.3, capLen - 8, 1.8, 0.9); g.fill();
    g.beginPath();
    g.arc(-L/2 + capLen - 3, -Wd/2 - 0.4, 1.4, 0, Math.PI * 2);
    g.fillStyle = st.light; g.fill();
    g.fillStyle = 'rgba(255,255,255,0.3)';
    roundRect(g, -L/2 + capLen + 4, -Wd/2 + 1, L - capLen - 12, 1, 0.5); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.25)';
    roundRect(g, L/2 - 3, -Wd/2, 1.5, Wd, 0.7); g.fill();

    penSprites.push({ shadow: S.cv, glow: G.cv, body: B.cv, sw, sh });
  }
}

// interpolated + network-corrected pose, no allocation
const _pose = { x: 0, y: 0, a: 0 };
function poseOf(p) {
  let x = p.x, y = p.y, a = p.angle;
  if (p.px !== undefined) {
    x = p.px + (p.x - p.px) * renderAlpha;
    y = p.py + (p.y - p.py) * renderAlpha;
    a = p.pa + (p.angle - p.pa) * renderAlpha;
  }
  if (p.ox) { x += p.ox; y += p.oy; a += p.oa; }
  _pose.x = x; _pose.y = y; _pose.a = a;
  return _pose;
}

function drawPen(p, isActive) {
  if (p.alpha <= 0) return;
  if (!penSprites.length) buildPenSprites();
  let k = p._k;
  if (k === undefined || k < 0) k = p._k = Math.max(0, PALETTE.indexOf(p.style));
  const spr = penSprites[k];
  const ps = poseOf(p);
  const fall = p.out ? 0.85 + 0.15 * p.alpha : 1;   // pens shrink slightly as they drop off the desk
  const hw = spr.sw / 2, hh = spr.sh / 2;

  ctx.save();
  ctx.globalAlpha = p.alpha;

  // shadow: fixed light direction, so offset in world space, rotate sprite only
  ctx.translate(ps.x + 2, ps.y + 4);
  ctx.rotate(ps.a);
  ctx.translate(COM_TO_GEOM, 0);
  if (fall !== 1) ctx.scale(fall, fall);
  ctx.drawImage(spr.shadow, -hw, -hh, spr.sw, spr.sh);
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = p.alpha;
  ctx.translate(ps.x, ps.y);
  ctx.rotate(ps.a);
  ctx.translate(COM_TO_GEOM, 0);
  if (fall !== 1) ctx.scale(fall, fall);
  if (isActive && !p.out) {
    const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 280);
    ctx.globalAlpha = p.alpha * (0.35 + pulse * 0.35);
    ctx.drawImage(spr.glow, -hw, -hh, spr.sw, spr.sh);
    ctx.globalAlpha = p.alpha;
  }
  ctx.drawImage(spr.body, -hw, -hh, spr.sw, spr.sh);
  ctx.restore();
}

function drawComMarker(p) {
  if (p.out) return;
  ctx.save();
  ctx.beginPath();
  ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(251,191,36,0.7)';
  ctx.lineWidth = 1.3; ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(p.x - 3, p.y); ctx.lineTo(p.x + 3, p.y);
  ctx.moveTo(p.x, p.y - 3); ctx.lineTo(p.x, p.y + 3);
  ctx.strokeStyle = 'rgba(251,191,36,0.55)';
  ctx.lineWidth = 1; ctx.stroke();
  ctx.restore();
}

function drawAim() {
  if (!drag || gameState !== 'aiming') return;
  const pen = pens[turn];
  if (!pen || pen.out) return;
  if (mode === 'online' && turn !== net.mySlot) return;
  if (spectating) return;

  const dx = drag.sx - drag.cx, dy = drag.sy - drag.cy;
  const len = Math.hypot(dx, dy);
  if (len < 6) return;
  const nx = dx / len, ny = dy / len;
  const power = Math.min(len, MAX_DRAG) / MAX_DRAG;
  const hx = drag.hx, hy = drag.hy;
  const ax = Math.cos(pen.angle), ay = Math.sin(pen.angle);
  const parallel = Math.abs(nx * ax + ny * ay);
  const impact = 0.40 + 0.60 * (1 - parallel);
  const hue = 25 + impact * 170;
  const lineCol = `hsla(${hue}, 90%, 62%, ${0.4 + impact * 0.55})`;
  const lineLen = 55 + power * 200;

  ctx.save();
  ctx.setLineDash([5, 7]);
  ctx.strokeStyle = 'rgba(255,255,255,0.28)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(drag.sx, drag.sy); ctx.lineTo(drag.cx, drag.cy);
  ctx.stroke();

  ctx.setLineDash([9, 9]);
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = lineCol;
  ctx.beginPath();
  ctx.moveTo(hx, hy); ctx.lineTo(hx + nx * lineLen, hy + ny * lineLen);
  ctx.stroke();
  ctx.setLineDash([]);

  const axp = hx + nx * lineLen, ayp = hy + ny * lineLen;
  ctx.beginPath();
  ctx.moveTo(axp + nx*14, ayp + ny*14);
  ctx.lineTo(axp - ny*8 - nx*4, ayp + nx*8 - ny*4);
  ctx.lineTo(axp + ny*8 - nx*4, ayp - nx*8 - ny*4);
  ctx.closePath();
  ctx.fillStyle = lineCol; ctx.fill();

  ctx.beginPath();
  ctx.arc(hx, hy, 4.5, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.fill();
  ctx.strokeStyle = 'rgba(59,130,246,0.9)';
  ctx.lineWidth = 1.4; ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(hx - 8, hy); ctx.lineTo(hx + 8, hy);
  ctx.moveTo(hx, hy - 8); ctx.lineTo(hx, hy + 8);
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 1; ctx.stroke();

  ctx.beginPath();
  ctx.arc(pen.x, pen.y, 22, -Math.PI/2, -Math.PI/2 + power * Math.PI * 2);
  ctx.strokeStyle = power > 0.8 ? '#f87171' : power > 0.5 ? '#fbbf24' : '#4ade80';
  ctx.lineWidth = 3.5; ctx.lineCap = 'round'; ctx.stroke();

  ctx.restore();
}

function drawHUD() {
  if (!pens.length) return;
  const n = pens.length;
  const chipH = 22, gap = 5, y = 10;
  ctx.font = '700 10.5px system-ui, sans-serif';
  const items = [];
  for (let i = 0; i < n; i++) {
    const name = playerName(i);
    const sc = String(score[i] || 0);
    const nameW = ctx.measureText(name).width;
    const scW = ctx.measureText(sc).width;
    const w = 10 + 9 + 5 + nameW + 7 + scW + 10;
    items.push({ w, name, sc, i });
  }
  let totalW = gap * (n - 1);
  for (const it of items) totalW += it.w;
  let x = (W - totalW) / 2;

  for (const it of items) {
    const p = pens[it.i];
    const isActive = (
      it.i === turn && !p.out &&
      (gameState === 'aiming' || gameState === 'ai' || gameState === 'moving')
    );
    const spectator = p.out;
    const col = p.style.body;
    roundRect(ctx, x, y, it.w, chipH, 7);
    if (isActive) {
      ctx.fillStyle = 'rgba(255,255,255,0.14)'; ctx.fill();
      ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.stroke();
    } else {
      ctx.fillStyle = spectator ? 'rgba(255,255,255,0.025)' : 'rgba(255,255,255,0.06)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.10)'; ctx.lineWidth = 1; ctx.stroke();
    }
    const dotX = x + 10 + 4.5, dotY = y + chipH/2;
    ctx.save();
    if (spectator) ctx.globalAlpha = 0.3;
    ctx.beginPath();
    ctx.arc(dotX, dotY, 4.5, 0, Math.PI * 2);
    if (isActive) {
      ctx.save(); ctx.globalAlpha *= 0.3; ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(dotX, dotY, 8, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      ctx.beginPath(); ctx.arc(dotX, dotY, 4.5, 0, Math.PI * 2);
    }
    ctx.fillStyle = col;
    ctx.fill();
    ctx.restore();
    ctx.fillStyle = spectator ? 'rgba(148,163,184,0.4)' : '#cbd5e1';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(it.name, x + 10 + 9 + 5, y + chipH/2 + 0.5);
    ctx.fillStyle = isActive ? '#fff' : '#94a3b8';
    const sw = ctx.measureText(it.sc).width;
    ctx.fillText(it.sc, x + it.w - 10 - sw, y + chipH/2 + 0.5);
    x += it.w + gap;
  }

  let label = '', labelCol = '#cbd5e1';
  const roundTag = inTiebreak()
    ? `TIEBREAK ${Math.min(tiebreakRoundsPlayed + 1, MAX_TIEBREAK)}/${MAX_TIEBREAK}`
    : `ROUND ${roundIndex + 1}/${totalRounds}`;

  if (gameState === 'aiming') {
    if (spectating) {
      label = `${roundTag} · SPECTATING`; labelCol = '#a855f7';
    } else if (mode === 'cpu') {
      label = `${roundTag} · YOUR TURN`; labelCol = '#93c5fd';
    } else if (mode === 'online') {
      label = (turn === net.mySlot)
        ? `${roundTag} · YOUR TURN`
        : `${roundTag} · ${playerName(turn)}'S TURN`;
      labelCol = (turn === net.mySlot) ? '#93c5fd' : '#cbd5e1';
    } else {
      label = `${roundTag} · PLAYER ${turn + 1}'S TURN`;
      labelCol = pens[turn] ? pens[turn].style.light : '#cbd5e1';
    }
  } else if (gameState === 'ai') {
    label = `${roundTag} · CPU IS AIMING…`; labelCol = '#fca5a5';
  } else if (gameState === 'moving') {
    label = `${roundTag} · …`; labelCol = '#64748b';
  }

  if (label) {
    ctx.font = '700 10.5px system-ui, sans-serif';
    const tw = ctx.measureText(label).width;
    const padX = 12, lw = tw + padX*2, lh = 20;
    const lx = (W - lw) / 2, ly = y + chipH + 6;
    roundRect(ctx, lx, ly, lw, lh, 10);
    ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.10)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = labelCol;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, W/2, ly + lh/2 + 0.5);
  }

  if (mode === 'online' && gameState === 'aiming' && !spectating) {
    const remain = Math.max(0, turnDeadline - performance.now());
    const secs = Math.ceil(remain / 1000);
    const pct  = remain / TURN_MS;
    const barW = 200, barH = 8;
    const bx = (W - barW) / 2, by = y + chipH + 32;
    roundRect(ctx, bx, by, barW, barH, 4);
    ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fill();
    roundRect(ctx, bx, by, barW * pct, barH, 4);
    ctx.fillStyle = pct > 0.5 ? '#4ade80' : pct > 0.2 ? '#fbbf24' : '#f87171';
    ctx.fill();
    ctx.fillStyle = '#94a3b8';
    ctx.font = '700 10px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(secs + 's', W/2, by + barH + 12);
  }
}

function drawRoundBanner() {
  if (gameState !== 'roundend') return;
  const a = Math.min(1, (2.0 - roundEndTimer) * 4) * Math.min(1, roundEndTimer * 3);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(6,8,14,0.6)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const scale = 1 + Math.max(0, (0.35 - (2.0 - roundEndTimer))) * 0.6;
  ctx.translate(W/2, H/2);
  ctx.scale(scale, scale);
  ctx.font = '900 44px system-ui, sans-serif';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = roundMsgColor;
  ctx.globalAlpha = a * 0.16; ctx.lineWidth = 16; ctx.strokeText(roundMsg, 0, -10);
  ctx.globalAlpha = a * 0.28; ctx.lineWidth = 8;  ctx.strokeText(roundMsg, 0, -10);
  ctx.globalAlpha = a;
  ctx.fillStyle = roundMsgColor;
  ctx.fillText(roundMsg, 0, -10);
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.font = '700 17px system-ui, sans-serif';
  const line = pens.map((_, i) => `${playerName(i)} ${score[i] || 0}`).join('   ·   ');
  ctx.fillText(line, 0, 40);
  ctx.restore();
}

function render() {
  if (!sceneCache) buildScene();
  ctx.drawImage(sceneCache, 0, 0, W, H);
  for (let i = 0; i < pens.length; i++) {
    const isActive = (i === turn && gameState === 'aiming' && !pens[i].out);
    drawPen(pens[i], isActive);
  }
  if (gameState === 'aiming' && pens[turn] && !pens[turn].out && !spectating &&
      (mode !== 'online' || turn === net.mySlot)) {
    drawComMarker(pens[turn]);
  }
  drawAim();
  
  if (sparks.length) {
    ctx.save();
    ctx.fillStyle = 'rgb(255,220,100)';
    for (const s of sparks) {
      ctx.globalAlpha = Math.max(0, s.life / s.maxLife);
      ctx.beginPath();
      ctx.arc(s.x, s.y, 2 + s.life * 10, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
  
  drawHUD();
  drawRoundBanner();
}

function getPos(e) {
  const r = canvasRect || (canvasRect = canvas.getBoundingClientRect());
  return {
    x: (e.clientX - r.left) * (W / r.width),
    y: (e.clientY - r.top)  * (H / r.height)
  };
}
canvas.addEventListener('pointerdown', (e) => {
  initAudio();
  canvasRect = canvas.getBoundingClientRect();
  if (gameState !== 'aiming') return;
  if (spectating) return;
  if (mode === 'online' && turn !== net.mySlot) return;
  const p = getPos(e);
  const pen = pens[turn];
  if (!pen || pen.out) return;
  if (distPointToPen(p.x, p.y, pen) > TOUCH_RADIUS) return;
  const ax = Math.cos(pen.angle), ay = Math.sin(pen.angle);
  let t = (p.x - pen.x) * ax + (p.y - pen.y) * ay;
  t = clamp(t, -COM_FROM_CAP, PEN_LEN - COM_FROM_CAP);
  drag = {
    sx: p.x, sy: p.y, cx: p.x, cy: p.y,
    hx: pen.x + ax * t, hy: pen.y + ay * t
  };
  try { canvas.setPointerCapture(e.pointerId); } catch(err) {}
  e.preventDefault();
});
canvas.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const p = getPos(e);
  drag.cx = p.x; drag.cy = p.y;
  e.preventDefault();
});
function releaseDrag() {
  if (!drag) return;
  const dx = drag.sx - drag.cx, dy = drag.sy - drag.cy;
  const len = Math.hypot(dx, dy);
  if (gameState === 'aiming' && len >= MIN_DRAG) {
    const nx = dx / len, ny = dy / len;
    const power = Math.min(len, MAX_DRAG) / MAX_DRAG;
    const speed = power * MAX_SPEED;
    const msg = { nx, ny, speed, hx: drag.hx, hy: drag.hy };
    if (mode === 'online') {
      if (net.isHost) {
        flick(pens[turn], { x: nx, y: ny }, speed, { x: drag.hx, y: drag.hy });
        sfxFlick(power);
        gameState = 'moving';
        settleTimer = 0;
        hostBroadcastApplyFlick(turn, msg);
      } else {
        netSendToHost({ t: 'flick', ...msg });
      }
    } else {
      flick(pens[turn], { x: nx, y: ny }, speed, { x: drag.hx, y: drag.hy });
      sfxFlick(power);
      gameState = 'moving';
      settleTimer = 0;
    }
  }
  drag = null;
}
canvas.addEventListener('pointerup', (e) => { releaseDrag(); e.preventDefault(); });
canvas.addEventListener('pointercancel', () => { drag = null; });
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
window.addEventListener('pointerup', releaseDrag);
window.addEventListener('pointercancel', () => { drag = null; });

let lastT = performance.now(), lastDraw = 0;
function loop(ts) {
  let dt = (ts - lastT) / 1000;
  lastT = ts;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;
  update(dt);
  // behind a menu/lobby overlay nothing moves: redraw only a few times a second
  if (!overlay.classList.contains('show') || ts - lastDraw > 250) {
    render();
    lastDraw = ts;
  }
  requestAnimationFrame(loop);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  lastT = performance.now();
  acc = 0; settleTimer = 0; aiTimer = Math.min(aiTimer, 0.65);
});

function wireMenu() {
  const onlineWrap = panel.querySelector('#onlineWrap');
  const localWrap  = panel.querySelector('#localWrap');
  const joinBox    = panel.querySelector('#joinBox');
  const createBox  = panel.querySelector('#createBox');
  const cpuSection = panel.querySelector('#cpuSection');
  const friendSection = panel.querySelector('#friendSection');
  const countRow   = panel.querySelector('#countRow');
  const diffRow    = panel.querySelector('#diffRow');

  let menuMode = 'cpu';
  let friendCount = 4;

  panel.querySelectorAll('[data-go]').forEach(b => {
    b.onclick = () => {
      const go = b.dataset.go;
      panel.querySelectorAll('[data-go]').forEach(x => x.classList.toggle('mode-active', x === b));
      onlineWrap.style.display = go === 'online' ? '' : 'none';
      localWrap.style.display  = go === 'online' ? 'none' : '';
      if (go === 'cpu') { menuMode = 'cpu'; cpuSection.style.display = ''; friendSection.style.display = 'none'; }
      else if (go === 'friend') { menuMode = 'friend'; cpuSection.style.display = 'none'; friendSection.style.display = ''; }
    };
  });

  panel.querySelectorAll('[data-online]').forEach(b => {
    b.onclick = () => {
      joinBox.style.display = b.dataset.online === 'join' ? '' : 'none';
      createBox.style.display = b.dataset.online === 'create' ? '' : 'none';
      if (b.dataset.online === 'join') setTimeout(() => {
        const el = document.getElementById('joinCode');
        if (el) el.focus();
      }, 50);
    };
  });

  countRow.querySelectorAll('button').forEach(b => {

  });

  document.querySelector('[data-go="cpu"]').click();

    <div id="inviteSlot"></div>

    <div class="diff-label" style="margin-top:1em">
      Players (${onlinePlayers.length}/10)
    </div>
    <div class="lobbyList" id="lobbyList">${rows}</div>

    <div class="diff-label" style="margin-top:.8em">
      Rounds (${MIN_ROUNDS}–${MAX_SELECTABLE_ROUNDS})
      ${isHost ? '' : '· host decides'}
    </div>
    <div class="diff" id="lobbyRoundRow">${roundBtns.join('')}</div>

    <div class="diff-label" style="margin-top:.6em">Room Chat (everyone)</div>
    <div class="chatBox" id="lobbyChat">${chatHtml}</div>
    <div class="chatRow">
      <input class="chatInput" id="lobbyChatInput" maxlength="200" placeholder="Type a message..." value="${escapeHtml(chatDraft)}"/>
      <button class="btn small" id="lobbyChatSend">Send</button>
    </div>

    <div class="endBtns" style="margin-top:1em">
      ${isHost
        ? `<button class="btn" id="startOnlineBtn" ${canStart ? '' : 'disabled'}>START MATCH</button>`
        : `<button class="btn" id="readyBtn">${iAmReady ? 'CANCEL READY' : "I'M READY"}</button>`
      }
      <button class="btn secondary" id="leaveBtn">LEAVE</button>
    </div>
    <p class="hint">
      ${isHost
        ? 'Wait for all players to ready up, then hit START.'
        : "Click I'M READY when you're set."}
    </p>
  `;

  wireLobby();
  placeInvite('inviteSlot');
  if (gameState === 'menu') overlay.classList.add('show');
}

function wireLobby() {
  const roundRow = document.getElementById('lobbyRoundRow');
  if (roundRow && net.isHost) {
    roundRow.querySelectorAll('[data-rounds]').forEach(b => {
      b.onclick = () => {
        const n = parseInt(b.dataset.rounds, 10);
        hostSetRounds(n);
      };
    });
  }

  const chatInput = document.getElementById('lobbyChatInput');
  const sendChat = () => {
    if (!chatInput) return;
    const txt = chatInput.value.trim();
    if (!txt) return;
    chatInput.value = '';
    if (net.isHost) {
      const me = onlinePlayers[net.mySlot];
      addChat({ name: me.name, text: txt });
      hostBroadcastChat({ name: me.name, text: txt });
    } else {
      netSendToHost({ t: 'chat', text: txt });
    }
  };
  const chatSendBtn = document.getElementById('lobbyChatSend');
  if (chatSendBtn) chatSendBtn.onclick = sendChat;
  if (chatInput) chatInput.onkeydown = e => { if (e.key === 'Enter') sendChat(); };

  document.querySelectorAll('[data-kick]').forEach(b => {
    b.onclick = () => {
      if (!net.isHost) return;
      const slot = parseInt(b.dataset.kick, 10);
      const target = onlinePlayers.find(p => p.slot === slot);
      if (!target) return;
      const tok = target.token;
      if (net.conns[tok]) {
        netSendTo(net.conns[tok], { t: 'kick' });
        setTimeout(() => { try { net.conns[tok].close(); } catch(e){} delete net.conns[tok]; }, 100);
      }
      const idx = onlinePlayers.findIndex(p => p.token === tok);
      if (idx >= 0) onlinePlayers.splice(idx, 1);
      onlinePlayers.forEach((p, i) => { p.slot = i; });
      hostNotifyAll(`${target.name} was kicked by host`, 'danger');
      addChat({ sys: true, text: `${target.name} was kicked` });
      hostBroadcastLobby();
      paintLobby();
    };
  });

  const leaveBtn = document.getElementById('leaveBtn');
  if (leaveBtn) leaveBtn.onclick = () => {
    if (!net.isHost) netSendToHost({ t: 'bye' });
    leaveRoom();
    gameState = 'menu';
    chatToggle.classList.remove('show');
    showMenu();
  };

  const startBtn = document.getElementById('startOnlineBtn');
  if (startBtn) startBtn.onclick = () => { initAudio(); hostStartMatch(); };

  const readyBtn = document.getElementById('readyBtn');
  if (readyBtn) readyBtn.onclick = () => {
    const me = onlinePlayers.find(p => p.slot === net.mySlot);
    if (!me) return;
    const newReady = !me.ready;
    netSendToHost({ t: 'ready', ready: newReady });
    me.ready = newReady;
    paintLobby();
  };
}

function showMenu() {
  gameState = 'menu';
  paintMenu();
}

resetPens();
mode = 'cpu';
paintMenu();
requestAnimationFrame(loop);

window.addEventListener('keydown', (e) => {
  if (e.key === 'm' || e.key === 'M') muted = !muted;
});

})();
</script>
</body>
</html>
