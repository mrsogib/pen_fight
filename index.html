<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pen খেলবি?</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{
    height:100%;
    background:radial-gradient(circle at 50% 15%,#242838,#0c0d12 70%);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:#e8ecf4;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    -webkit-user-select:none;user-select:none;
  }
  #game{position:relative;width:min(96vw,900px,132vh);aspect-ratio:900/620}
  #game::before{
    content:'';position:absolute;inset:0;border-radius:16px;z-index:0;

  #overlay{
    position:fixed;inset:0;z-index:20;

  #overlay.show{display:flex}
  .panel{
    text-align:center;max-width:620px;width:100%;

    border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);

  }
  .sigBox:focus{border-color:#3b82f6}
  #chatInviteSlot:not(:empty){margin-bottom:.6em;padding-bottom:.6em;border-bottom:1px solid rgba(255,255,255,.1)}
  .statusLine{font-size:12px;color:#94a3b8;margin:.5em 0;min-height:1.2em}
  #chatToggle{
    position:absolute;bottom:12px;right:12px;z-index:15;
    width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;
    background:linear-gradient(180deg,#3b82f6,#1d4ed8);color:#fff;

    position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;
    border-radius:9px;background:#ef4444;color:#fff;font-size:10px;font-weight:800;
    line-height:18px;text-align:center;padding:0 4px;display:none;
  }
  #chatToggle .badge.show{display:block}
  #chatFloat{
    position:absolute;bottom:64px;right:12px;z-index:15;
    width:min(320px,80vw);background:rgba(12,14,20,.96);
    border:1px solid rgba(255,255,255,.1);border-radius:12px;
    padding:.7em;display:none;
    box-shadow:0 20px 60px rgba(0,0,0,.6);
  }
  #chatFloat.show{display:block}
  #chatFloat .chatBox{max-height:180px;margin:0 0 .4em}
  #notifications{
    position:fixed;top:16px;left:50%;transform:translateX(-50%);
    z-index:30;display:flex;flex-direction:column;gap:8px;
    pointer-events:none;align-items:center;width:100%;
  }
  .notification{
    padding:.65em 1.3em;border-radius:10px;
    background:rgba(12,14,20,.94);
    border:1px solid rgba(255,255,255,.15);
    color:#e8ecf4;font-size:13px;font-weight:700;letter-spacing:.02em;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
    animation:noteIn .28s cubic-bezier(.2,1.4,.5,1);
    max-width:min(90vw,500px);text-align:center;
  }
  .notification.info   { border-color:rgba(96,165,250,.4); color:#bfdbfe; }
  .notification.join   { border-color:rgba(134,239,172,.5); color:#86efac; }
  .notification.leave  { border-color:rgba(248,113,113,.5); color:#fca5a5; }
  .notification.warn   { border-color:rgba(251,191,36,.5);  color:#fde68a; }
  .notification.danger { border-color:rgba(239,68,68,.7);   color:#fca5a5; }

  @keyframes noteIn  { from{opacity:0;transform:translateY(-12px) scale(.95)} to{opacity:1;transform:none} }
  @keyframes noteOut { from{opacity:1;transform:none} to{opacity:0;transform:translateY(-12px) scale(.95)} }
  
  .rotate-modal {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(8, 9, 14, 0.97);
    display: none; align-items: center; justify-content: center;
    padding: 24px; text-align: center; flex-direction: column;
  }
  @media (max-width: 900px) and (orientation: portrait) {
    .rotate-modal:not(.dismissed) { display: flex; }

    font-size: 64px; display: inline-block;

  }

  }
  .rotate-modal h2 { font-size: 24px; margin-bottom: 10px; color: #fff; }
  .rotate-modal p { color: #94a3b8; margin-bottom: 30px; font-size: 14px; line-height: 1.5; max-width: 300px; }
  .rotate-modal .btn { width: 100%; max-width: 280px; }

  @media (max-height:560px){
    .panel h1{font-size:24px;margin-bottom:.2em}
    .panel .sub{font-size:11px;margin-bottom:.8em}
    .diff{margin-bottom:.6em}
    .panel .hint{display:none}
  }
</style>

<body>

<div id="rotateModal" class="rotate-modal">
  <div class="rotate-icon">📱</div>
  <h2>Rotate Your Device</h2>
  <p>Please rotate your phone to landscape mode. It makes the desk much bigger and aiming much easier!</p>
  <button class="btn secondary" id="dismissRotate">Continue Anyway</button>
</div>

<div id="game">
  <canvas id="cv"></canvas>
  <div id="overlay" class="show">
    <div class="panel" id="panel"></div>
  </div>
  <button id="chatToggle" title="Room Chat">💬<span class="badge" id="chatBadge">0</span></button>
  <div id="chatFloat">
    <div id="chatInviteSlot"></div>
    <div class="chatBox" id="chatFloatBox"></div>
    <div class="chatRow">
      <input class="chatInput" id="chatFloatInput" placeholder="Type a message to everyone..."/>
      <button class="btn small" id="chatFloatSend">Send</button>
    </div>
  </div>
</div>
<div id="notifications"></div>

<script>
(() => {
'use strict';

document.getElementById('dismissRotate').addEventListener('click', () => {
  document.getElementById('rotateModal').classList.add('dismissed');
});

window.addEventListener('beforeunload', (e) => {
  if (net.isHost && net.phase !== 'idle') {
    e.preventDefault();
    e.returnValue = 'Refreshing will close the room for everyone!';
  }
});

const W = 900, H = 620;
const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');
let DPR = 1, fitted = false; // backing-store scale (matches on-screen size, capped at 2)
let canvasRect = null;       // cached so pointermove never forces layout
let sceneCache = null;       // background + desk, drawn once
let deskCache = null;
const penSprites = [];       // pre-rendered pens per palette colour
let renderAlpha = 1;         // physics interpolation factor

function fitCanvas() {
  const r = canvas.getBoundingClientRect();
  canvasRect = r;
  const dpr = window.devicePixelRatio || 1;
  let s = r.width > 0 ? (r.width * dpr) / W : Math.min(dpr, 2);
  s = Math.round(clamp(s, 0.75, 2) * 100) / 100;
  if (fitted && Math.abs(s - DPR) < 0.01) return;
  fitted = true;
  DPR = s;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  sceneCache = null; deskCache = null; penSprites.length = 0;
}

const DESK = { x: 60, y: 86, w: 780, h: 460 };

const PEN_LEN = 74, PEN_WID = 7, PEN_RAD = PEN_WID / 2;
const PEN_HALF = (PEN_LEN - PEN_WID) / 2;
const COM_FROM_CAP = 0.40 * PEN_LEN;
const COM_TO_GEOM  = PEN_LEN / 2 - COM_FROM_CAP;

// --- FAST & ENDS FAST PHYSICS ---
const PEN_MASS      = 0.5;    // Exactly 0.5 as requested
const FIXED        = 1 / 240;
const DAMP_LIN     = 0.1;     // Heavy air resistance to slow down quickly
const DAMP_ANG     = 0.1;
const FRIC_LIN     = 250;     // High surface friction
const FRIC_ANG     = 5.0;

const MAX_DRAG     = 100;     // Shorter drag required for max power
const MAX_SPEED    = 1200;    // Reduced max power so it doesn't fly forever
const FLICK_TORQUE = 0.2;     // Less crazy spinning
const MAX_SPIN     = 35;
// -----------------------------

const MIN_DRAG     = 18;
const TOUCH_RADIUS = PEN_RAD + 48;

const MIN_ROUNDS            = 3;
const MAX_SELECTABLE_ROUNDS = 10;
const MAX_DEFAULT_ROUNDS    = 5;
const MAX_TIEBREAK          = 3;

const EVERY_OTHER_MIN = 6;

const TURN_MS          = 30000; 
const DISCONNECT_GRACE = 30000;
const NOTIFY_MS        = 1800;

// ───────────────────────── ONLINE (native WebRTC, no libraries) ─────────────────────────
// Connection is set up by copy-pasting two codes (invite → reply). No signalling server.
// STUN only lets a device learn its own public address (nothing is loaded from it).
// Set ICE_SERVERS = [] for zero outside contact: then only devices on the SAME Wi-Fi can connect.
// You can also add your own TURN relay here for networks that block direct connections.
const ICE_SERVERS = [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun.cloudflare.com:3478' },
  // { urls: 'turn:your.server:3478', username: 'user', credential: 'pass' },
];

function b64url(u8) {
  let s = '';
  for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function unb64url(str) {
  str = str.replace(/-/g, '+').replace(/_/g, '/');
  while (str.length % 4) str += '=';
  const bin = atob(str), u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u;
}
async function streamBytes(bytes, stream) {
  return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer());
}
async function packSignal(desc) {
  let bytes = new TextEncoder().encode(JSON.stringify({ t: desc.type, s: desc.sdp }));
  let tag = 'P0';
  if (window.CompressionStream) {
    try { bytes = await streamBytes(bytes, new CompressionStream('deflate-raw')); tag = 'P1'; } catch (e) {}
  }
  return tag + b64url(bytes);
}
async function unpackSignal(text) {
  let t = String(text || '').trim();
  const h = t.indexOf('#j='); if (h >= 0) t = t.slice(h + 3);
  t = t.replace(/\s+/g, '');
  if (t.length < 20 || (t[0] !== 'P') || (t[1] !== '0' && t[1] !== '1')) throw new Error('That is not a valid code.');
  let bytes;
  try { bytes = unb64url(t.slice(2)); } catch (e) { throw new Error('Code is damaged — copy it again.'); }
  if (t[1] === '1') {
    if (!window.DecompressionStream) throw new Error('This browser is too old for these codes.');
    try { bytes = await streamBytes(bytes, new DecompressionStream('deflate-raw')); }
    catch (e) { throw new Error('Code is damaged — copy it again.'); }
  }
  let o;
  try { o = JSON.parse(new TextDecoder().decode(bytes)); } catch (e) { throw new Error('Code is damaged — copy it again.'); }
  if (!o || !o.s || (o.t !== 'offer' && o.t !== 'answer')) throw new Error('That is not a valid code.');
  return { type: o.t, sdp: o.s };
}
function waitIce(pc, ms) {
  return new Promise(res => {
    if (pc.iceGatheringState === 'complete') return res();
    const done = () => { if (pc.iceGatheringState === 'complete') { clearTimeout(t); res(); } };
    const t = setTimeout(res, ms || 4000);
    pc.addEventListener('icegatheringstatechange', done);
  });
}

// small connection object: .open .send(obj) .close() .metadata .on('open'|'data'|'close', fn)
function makeLink(pc) {
  const L = {
    pc, dc: null, metadata: null, _h: {}, _closed: false, _opened: false, _dt: 0,
    on(ev, fn) { (this._h[ev] = this._h[ev] || []).push(fn); return this; },
    _emit(ev, a) { for (const f of (this._h[ev] || [])) { try { f(a); } catch (e) { console.error(e); } } },
    get open() { return !!this.dc && this.dc.readyState === 'open'; },
    send(obj) { if (this.open) this.dc.send(JSON.stringify(obj)); },
    close() { this._closed = true; clearTimeout(this._dt); try { this.dc && this.dc.close(); } catch (e) {} try { pc.close(); } catch (e) {} },
    _lost() {
      if (this._closed) return;
      this._closed = true; clearTimeout(this._dt);
      try { this.dc && this.dc.close(); } catch (e) {}
      try { pc.close(); } catch (e) {}
      this._emit('close');
    },
  };
  pc.onconnectionstatechange = () => {
    const st = pc.connectionState;
    if (st === 'failed' || st === 'closed') L._lost();
    else if (st === 'disconnected') {
      clearTimeout(L._dt);
      L._dt = setTimeout(() => { if (pc.connectionState === 'disconnected') L._lost(); }, 6000);
    }
  };
  return L;
}
function bindChannel(L, dc) {
  L.dc = dc;
  dc.onopen = () => { if (!L._opened) { L._opened = true; L._emit('open'); } };
  dc.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch (err) { return; } L._emit('data', m); };
  dc.onclose = () => L._lost();
  if (dc.readyState === 'open') setTimeout(() => dc.onopen && dc.onopen(), 0);
}
async function createInvite() {
  const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
  const L = makeLink(pc);
  bindChannel(L, pc.createDataChannel('pen', { ordered: true }));
  await pc.setLocalDescription(await pc.createOffer());
  await waitIce(pc);
  return { link: L, code: await packSignal(pc.localDescription) };
}
async function acceptReply(link, text) {
  const d = await unpackSignal(text);
  if (d.type !== 'answer') throw new Error('That is an invite code. Paste the friend\'s REPLY code here.');
  await link.pc.setRemoteDescription(d);
}
async function createReply(text) {
  const d = await unpackSignal(text);
  if (d.type !== 'offer') throw new Error('That is a reply code. Paste the host\'s INVITE code here.');
  const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
  const L = makeLink(pc);
  pc.ondatachannel = e => bindChannel(L, e.channel);
  await pc.setRemoteDescription(d);
  await pc.setLocalDescription(await pc.createAnswer());
  await waitIce(pc);
  return { link: L, code: await packSignal(pc.localDescription) };
}

const PEN_INERTIA = (() => {
  const mBody = 0.8, mCap = 0.2;
  const dBody = (PEN_LEN / 2) - COM_FROM_CAP;
  const dCap  = 0 - COM_FROM_CAP;
  return (mBody*dBody*dBody + mCap*dCap*dCap + PEN_WID*PEN_WID/12) * PEN_MASS;
})();

const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
fitCanvas();
window.addEventListener('resize', fitCanvas);
if (window.ResizeObserver) new ResizeObserver(fitCanvas).observe(canvas);

let _seed = (Math.random() * 1e9) | 0;
function setSeed(s) { _seed = (s | 0) || 1; }
function srand() {
  _seed |= 0; _seed = _seed + 0x6D2B79F5 | 0;
  let t = Math.imul(_seed ^ _seed >>> 15, 1 | _seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}

  let t = null;
  try { t = localStorage.getItem('pfj_token'); } catch(e){}
  if (!t) {

const notificationsEl = document.getElementById('notifications');
let activeNotifications = 0;
const MAX_NOTIFICATIONS = 5;

function pushNotification(text, type = 'info', duration = NOTIFY_MS) {
  if (activeNotifications >= MAX_NOTIFICATIONS) {
    const oldest = notificationsEl.firstElementChild;
    if (oldest) { oldest.remove(); activeNotifications--; }
  }
  activeNotifications++;
  const el = document.createElement('div');
  el.className = 'notification ' + type;
  el.textContent = text;
  notificationsEl.appendChild(el);
  setTimeout(() => {
    el.classList.add('fadeOut');
    setTimeout(() => {
      el.remove();
      activeNotifications = Math.max(0, activeNotifications - 1);
    }, 320);
  }, duration);
}

function hostNotifyAll(text, type = 'info', duration = NOTIFY_MS) {
  pushNotification(text, type, duration);
  netBroadcast({ t: 'notify', text, type, duration });
}

  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}

function makePen(x, y, angle, index, isCpu) {
  const p = {
    x, y, angle, vx:0, vy:0, omega:0,
    ex:0, ey:0, cx:0, cy:0,
    mass: PEN_MASS, invMass: 1 / PEN_MASS,
    inertia: PEN_INERTIA, invInertia: 1 / PEN_INERTIA,
    radius: PEN_RAD, length: PEN_LEN, width: PEN_WID,
    index, isCpu: !!isCpu,
    style: PALETTE[index % PALETTE.length],
    out: false, alpha: 1
  };
  updateAxes(p);
  return p;
}
function updateAxes(p) {
  const c = Math.cos(p.angle), s = Math.sin(p.angle);
  p.ex = c * PEN_HALF; p.ey = s * PEN_HALF;
  p.cx = c * COM_TO_GEOM; p.cy = s * COM_TO_GEOM;
}
function penEnds(p) {
  return {
    a1x: p.x + p.cx - p.ex, a1y: p.y + p.cy - p.ey,
    a2x: p.x + p.cx + p.ex, a2y: p.y + p.cy + p.ey
  };
}
function distPointToPen(px, py, pen) {
  const e = penEnds(pen);
  const dx = e.a2x - e.a1x, dy = e.a2y - e.a1y;
  const l2 = dx*dx + dy*dy || 1;
  let t = ((px - e.a1x)*dx + (py - e.a1y)*dy) / l2;
  t = clamp(t, 0, 1);
  const cx = e.a1x + dx*t, cy = e.a1y + dy*t;
  return Math.hypot(px - cx, py - cy);
}
function applyImpulse(body, jx, jy, rx, ry) {
  body.vx += jx * body.invMass;
  body.vy += jy * body.invMass;
  body.omega += (rx*jy - ry*jx) * body.invInertia;
}
function closestSegSeg(p1x,p1y,q1x,q1y,p2x,p2y,q2x,q2y) {
  const d1x = q1x-p1x, d1y = q1y-p1y;
  const d2x = q2x-p2x, d2y = q2y-p2y;
  const rx  = p1x-p2x, ry  = p1y-p2y;
  const a = d1x*d1x + d1y*d1y;
  const e = d2x*d2x + d2y*d2y;
  const f = d2x*rx  + d2y*ry;
  const EPS = 1e-8;
  let s, t;
  if (a <= EPS && e <= EPS) { s = 0; t = 0; }
  else if (a <= EPS) { s = 0; t = clamp(f/e, 0, 1); }
  else {
    const c = d1x*rx + d1y*ry;
    if (e <= EPS) { t = 0; s = clamp(-c/a, 0, 1); }
    else {
      const b = d1x*d2x + d1y*d2y;
      const denom = a*e - b*b;
      s = denom > EPS ? clamp((b*f - c*e)/denom, 0, 1) : 0;
      t = (b*s + f) / e;
      if (t < 0)      { t = 0; s = clamp(-c/a, 0, 1); }
      else if (t > 1) { t = 1; s = clamp((b - c)/a, 0, 1); }
    }
  }
  return { c1x: p1x + d1x*s, c1y: p1y + d1y*s, c2x: p2x + d2x*t, c2y: p2y + d2y*t };
}
function resolvePenPair(a, b) {
  // broad phase: geometric centres too far apart to possibly touch
  const bx0 = (a.x + a.cx) - (b.x + b.cx), by0 = (a.y + a.cy) - (b.y + b.cy);
  const lim = PEN_LEN + PEN_WID;
  if (bx0*bx0 + by0*by0 > lim*lim) return;
  const ea = penEnds(a), eb = penEnds(b);
  const res = closestSegSeg(ea.a1x, ea.a1y, ea.a2x, ea.a2y, eb.a1x, eb.a1y, eb.a2x, eb.a2y);
  let dx = res.c2x - res.c1x, dy = res.c2y - res.c1y;
  let d  = Math.hypot(dx, dy);
  const rsum = a.radius + b.radius;
  if (d >= rsum) return;
  let nx, ny;
  if (d < 1e-5) {
    const al = Math.hypot(a.ex, a.ey) || 1;
    nx = -a.ey / al; ny = a.ex / al; d = 1e-5;
  } else { nx = dx / d; ny = dy / d; }
  const penetration = rsum - d;
  const px = (res.c1x + res.c2x) * 0.5;
  const py = (res.c1y + res.c2y) * 0.5;
  const r1x = px - a.x, r1y = py - a.y;
  const r2x = px - b.x, r2y = py - b.y;
  const v1x = a.vx - a.omega*r1y, v1y = a.vy + a.omega*r1x;
  const v2x = b.vx - b.omega*r2y, v2y = b.vy + b.omega*r2x;
  const rvx = v2x - v1x, rvy = v2y - v1y;
  const vn = rvx*nx + rvy*ny;
  const cr1 = r1x*ny - r1y*nx;
  const cr2 = r2x*ny - r2y*nx;
  const denom = a.invMass + b.invMass + cr1*cr1*a.invInertia + cr2*cr2*b.invInertia;
  
  if (vn < 0) {
    const e = 0.8; // SHARP BOUNCE
    const j = -(1 + e) * vn / denom;
    applyImpulse(a, -j*nx, -j*ny, r1x, r1y);
    applyImpulse(b,  j*nx,  j*ny, r2x, r2y);
    const tx = -ny, ty = nx;
    const vt = rvx*tx + rvy*ty;
    const mu = 0.2;
    const jt = clamp(-vt / denom, -mu*j, mu*j);
    applyImpulse(a, -jt*tx, -jt*ty, r1x, r1y);
    applyImpulse(b,  jt*tx,  jt*ty, r2x, r2y);
    
    if (!simMode && Math.abs(vn) > 120) {
      sfxPlasticHit(Math.abs(vn));
      if (Math.abs(vn) > 250) {
        const mag = Math.min(Math.abs(vn) / 1000, 1);
        for (let i = 0; i < 4 && sparks.length < 60; i++) {
          sparks.push({
            x: px, y: py,
            vx: (Math.random() - 0.5) * 250 * mag,
            vy: (Math.random() - 0.5) * 250 * mag,
            life: 0.2 + Math.random() * 0.15,
            maxLife: 0.35
          });
        }
      }
    }
  }
  const corr = Math.max(penetration - 0.05, 0) * 0.8 / (a.invMass + b.invMass);
  a.x -= nx * corr * a.invMass;
  a.y -= ny * corr * a.invMass;
  b.x += nx * corr * b.invMass;
  b.y += ny * corr * b.invMass;
}
function physicsStep(pens, dt) {
  for (const p of pens) {
    if (p.out) {
      p.x += p.vx * dt * 0.55;
      p.y += p.vy * dt * 0.55;
      p.angle += p.omega * dt * 0.55;
      updateAxes(p);
      p.alpha = Math.max(0, p.alpha - dt * 2.2);
      continue;
    }
    p.x += p.vx * dt; p.y += p.vy * dt; p.angle += p.omega * dt;
    updateAxes(p);
    const dampL = Math.pow(DAMP_LIN, dt);
    const sp = Math.hypot(p.vx, p.vy);
    if (sp > 1e-6) {
      const ns = Math.max(0, sp*dampL - FRIC_LIN*dt);
      const k = ns / sp;
      p.vx *= k; p.vy *= k;
    }
    const dampA = Math.pow(DAMP_ANG, dt);
    const om = Math.abs(p.omega);
    if (om > 1e-6) {
      p.omega = Math.sign(p.omega) * Math.max(0, om*dampA - FRIC_ANG*dt);
    }
  }
  const n = pens.length;
  for (let i = 0; i < n; i++) {
    if (pens[i].out) continue;
    for (let j = i + 1; j < n; j++) {
      if (pens[j].out) continue;
      resolvePenPair(pens[i], pens[j]);
      resolvePenPair(pens[i], pens[j]);
    }
  }
}
function allSettled(pens) {
  for (const p of pens) {
    if (p.out) continue;
    // Higher threshold to end the turn almost instantly when it slows down
    if (Math.hypot(p.vx, p.vy) > 40) return false;
    if (Math.abs(p.omega) > 2.0) return false;
  }
  return true;
}
function isOut(p) {
  const gx = p.x + p.cx, gy = p.y + p.cy;
  return gx < DESK.x || gx > DESK.x + DESK.w ||
         gy < DESK.y || gy > DESK.y + DESK.h;
}
function distToEdge(p) {
  const gx = p.x + p.cx, gy = p.y + p.cy;
  return Math.min(gx - DESK.x, DESK.x + DESK.w - gx, gy - DESK.y, DESK.y + DESK.h - gy);
}
function flick(pen, dir, speed, hitPoint) {
  const ax = Math.cos(pen.angle), ay = Math.sin(pen.angle);
  const parallel = Math.abs(dir.x * ax + dir.y * ay);
  const impactScale = 0.40 + 0.60 * (1 - parallel);
  const effectiveSpeed = speed * impactScale;
  const jx = dir.x * effectiveSpeed * pen.mass;
  const jy = dir.y * effectiveSpeed * pen.mass;
  pen.vx += jx * pen.invMass;
  pen.vy += jy * pen.invMass;
  const rx = hitPoint.x - pen.x;
  const ry = hitPoint.y - pen.y;
  const torque = (rx*jy - ry*jx) * pen.invInertia * FLICK_TORQUE;
  pen.omega = clamp(pen.omega + torque, -MAX_SPIN, MAX_SPIN);
  return impactScale;
}

function serializePens(arr) {
  return arr.map(p => ({
    x: p.x, y: p.y, angle: p.angle,
    vx: p.vx, vy: p.vy, omega: p.omega,
    out: p.out, alpha: p.alpha
  }));
}
function deserializePens(snap, playerCount) {
  const out = [];
  for (let i = 0; i < playerCount; i++) {
    const s = snap && snap[i];
    if (s && s.alpha > 0) {
      const p = makePen(s.x, s.y, s.angle, i, false);
      p.vx = s.vx; p.vy = s.vy; p.omega = s.omega;
      p.out = s.out; p.alpha = s.alpha;
      out.push(p);
    } else {
      const p = makePen(-1000, -1000, 0, i, false);
      p.out = true; p.alpha = 0;
      out.push(p);
    }
  }
  return out;
}

let audioCtx = null, simMode = false, muted = false;
let lastHitSfx = -1;
const noiseBufs = {};
function getNoiseBuf(dur) {
  if (!noiseBufs[dur] || noiseBufs[dur].sampleRate !== audioCtx.sampleRate) {
    const n = Math.floor(audioCtx.sampleRate * dur);
    const b = audioCtx.createBuffer(1, n, audioCtx.sampleRate);
    const d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    noiseBufs[dur] = b;
  }
  return noiseBufs[dur];
}
function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e) { audioCtx = null; }
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function sfxPlasticHit(intensity) {
  if (muted || simMode || !audioCtx) return;
  const t = audioCtx.currentTime;
  if (t - lastHitSfx < 0.03) return;
  lastHitSfx = t;
  const mag = Math.min(intensity / 1000, 1);

  // 1. High Pitch Crack (5750 Hz)
  const osc = audioCtx.createOscillator();
  osc.type = 'triangle'; 
  osc.frequency.setValueAtTime(5750, t);
  osc.frequency.exponentialRampToValueAtTime(1000, t + 0.015);

  const oscGain = audioCtx.createGain();
  oscGain.gain.setValueAtTime(0.4 * mag, t);
  oscGain.gain.exponentialRampToValueAtTime(0.001, t + 0.02);

  osc.connect(oscGain).connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + 0.025);

  // 2. High Noise (Bandpass 5750 Hz)
  const noise = audioCtx.createBufferSource();
  noise.buffer = getNoiseBuf(0.03);

  const filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass'; 
  filter.frequency.value = 5750; 
  filter.Q.value = 1.5;

  const noiseGain = audioCtx.createGain();
  noiseGain.gain.setValueAtTime(0.5 * mag, t); 
  noiseGain.gain.exponentialRampToValueAtTime(0.001, t + 0.03);

  noise.connect(filter).connect(noiseGain).connect(audioCtx.destination);
  noise.start(t);
}

function sfxFlick(power) {
  if (muted || !audioCtx) return;
  const t = audioCtx.currentTime;
  const mag = Math.min(power, 1);

  // 1. Thud Body (450 Hz -> 100 Hz)
  const osc = audioCtx.createOscillator();
  osc.type = 'triangle'; 
  osc.frequency.setValueAtTime(450, t);
  osc.frequency.exponentialRampToValueAtTime(100, t + 0.05);

  const oscGain = audioCtx.createGain();
  oscGain.gain.setValueAtTime(0.4 * mag, t);
  oscGain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);

  osc.connect(oscGain).connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + 0.09);

  // 2. Slide Texture (Low-passed Noise)
  const noise = audioCtx.createBufferSource();
  noise.buffer = getNoiseBuf(0.08);

  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass'; 
  filter.frequency.setValueAtTime(1200, t);
  filter.frequency.exponentialRampToValueAtTime(300, t + 0.06);

  const noiseGain = audioCtx.createGain();
  noiseGain.gain.setValueAtTime(0.3 * mag, t); 
  noiseGain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);

  noise.connect(filter).connect(noiseGain).connect(audioCtx.destination);
  noise.start(t);
}

function sfxTone(freq, dur, vol, type) {
  if (muted || !audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  o.connect(g).connect(audioCtx.destination);
  o.start(t); o.stop(t + dur + 0.02);
}

function nextAliveAfter(idx) {
  for (let k = 1; k <= pens.length; k++) {
    const j = (idx + k) % pens.length;
    if (!pens[j].out) return j;
  }
  return -1;
}
function inTiebreak() { return tiebreakPlayers.length > 0; }
function activePlayersForRound() {
  if (inTiebreak()) return tiebreakPlayers.slice();
  return Array.from({length: playerCount}, (_, i) => i);
}
function leadersIn(playerIdxs) {
  let maxScore = -Infinity;
  for (const i of playerIdxs) if ((score[i] || 0) > maxScore) maxScore = score[i];
  const out = [];
  for (const i of playerIdxs) if (score[i] === maxScore) out.push(i);
  return out;
}
function buildBreakerOrderFor(idxs, count) {
  const n = idxs.length;
  if (n === 0 || count === 0) return [];
  const anchor = randInt(0, n - 1);
  const order = [];
  if (n < EVERY_OTHER_MIN) {
    for (let k = 0; k < count; k++) order.push(idxs[(anchor + k) % n]);
    return order;
  }
  for (let k = 0; k < count; k++) {
    const p = idxs[(anchor + k * 2) % n];
    if (!order.includes(p)) order.push(p);
  }
  let off = 1;
  while (order.length < count && off < n) {
    const p = idxs[(anchor + off) % n];
    if (!order.includes(p)) order.push(p);
    off++;
  }
  let guard = 0;
  while (order.length < count && guard < 1000) {
    order.push(idxs[(anchor + order.length) % n]);
    guard++;
  }
  return order.slice(0, count);
}

// ---- host: invite box (lives in the lobby, and in the chat panel during a match) ----
let inviteState = null;     // { busy, code, link, reply, status, accepted }
const inviteEl = document.createElement('div');
inviteEl.id = 'inviteBox';

function renderInvite() {
  if (!net.isHost) { inviteEl.innerHTML = ''; return; }
  const full = onlinePlayers.length >= 10;
  if (!inviteState) {
    inviteEl.innerHTML = `<button class="btn small" id="invAdd" ${full ? 'disabled' : ''}>＋ INVITE / RECONNECT A PLAYER</button>`;
    inviteEl.querySelector('#invAdd').onclick = startInvite;
    return;
  }
  if (inviteState.busy) {
    inviteEl.innerHTML = `<div class="statusLine">Creating invite…</div>`;
    return;
  }
  inviteEl.innerHTML = `
    <div class="diff-label">1 · Send this invite to your friend</div>
    <textarea class="sigBox" id="invCode" readonly>${escapeHtml(inviteState.code)}</textarea>
    <div class="copyRow">
      <button class="btn small" id="invCopy">📋 Copy code</button>
      <button class="btn small secondary" id="invCopyLink">🔗 Copy link</button>
    </div>
    <div class="diff-label">2 · Paste their reply code</div>
    <textarea class="sigBox" id="invReply" placeholder="Paste reply code…"></textarea>
    <div class="statusLine" id="invStatus">${escapeHtml(inviteState.status || '')}</div>
    <div class="copyRow">
      <button class="btn small" id="invConnect">CONNECT</button>
      <button class="btn small secondary" id="invCancel">CANCEL</button>
    </div>`;
  const replyEl = inviteEl.querySelector('#invReply');
  replyEl.value = inviteState.reply || '';
  replyEl.oninput = () => { inviteState.reply = replyEl.value; };
  replyEl.onpaste = () => setTimeout(() => { inviteState.reply = replyEl.value; connectInvite(); }, 30);
  inviteEl.querySelector('#invCopy').onclick = e => copyText(inviteState.code, e.target, '📋 Copy code');
  inviteEl.querySelector('#invCopyLink').onclick = e =>
    copyText(`${location.origin}${location.pathname}#j=${inviteState.code}`, e.target, '🔗 Copy link');
  inviteEl.querySelector('#invConnect').onclick = connectInvite;
  inviteEl.querySelector('#invCancel').onclick = cancelInvite;
}
function setInviteStatus(t) {
  if (inviteState) inviteState.status = t;
  const el = inviteEl.querySelector('#invStatus'); if (el) el.textContent = t;
}
function copyText(text, btn, label) {
  const done = () => { btn.textContent = '✓ Copied!'; setTimeout(() => { btn.textContent = label; }, 1500); };
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta); done();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
  else fallback();
}
function placeInvite(slotId) {
  const slot = document.getElementById(slotId);
  if (!slot) return;
  slot.innerHTML = '';
  if (net.isHost && net.phase !== 'idle') {
    slot.appendChild(inviteEl);
    if (!inviteEl.firstChild) renderInvite();
  }
}
async function startInvite() {
  if (inviteState) return;
  inviteState = { busy: true };
  renderInvite();
  try {
    const inv = await createInvite();
    if (!inviteState) { inv.link.close(); return; }
    inviteState = { code: inv.code, link: inv.link, reply: '', status: '', accepted: false };
    inv.link.on('data', msg => hostOnGuestMessage(inv.link, msg));
    inv.link.on('close', () => hostOnConnClosed(inv.link));
    inv.link.on('open', () => { if (inviteState && inviteState.link === inv.link) { inviteState = null; renderInvite(); } });
  } catch (e) {
    inviteState = null;
    pushNotification('Could not create invite: ' + (e.message || e), 'danger', 3500);
  }
  renderInvite();
}
async function connectInvite() {
  if (!inviteState || !inviteState.link || inviteState.accepted) return;
  const text = (inviteState.reply || '').trim();
  if (!text) { setInviteStatus('Paste the reply code first.'); return; }
  const link = inviteState.link;
  try {
    await acceptReply(link, text);
    inviteState.accepted = true;
    setInviteStatus('Connecting…');
    setTimeout(() => {
      if (inviteState && inviteState.link === link && !link.open) {
        inviteState.accepted = false; link.close();
        inviteState = null; renderInvite();
        pushNotification('Could not connect. Try again — same Wi-Fi works best.', 'warn', 4500);
      }
    }, 25000);
  } catch (e) {
    setInviteStatus(e.message || 'Invalid reply code.');
  }
}
function cancelInvite() {
  if (inviteState && inviteState.link) inviteState.link.close();
  inviteState = null;
  renderInvite();
}

// ---- guest: paste invite → create reply → host connects ----
let joinLink = null, joinTimer = 0;
function setJoinStatus(t) { const el = document.getElementById('joinStatus'); if (el) el.textContent = t; }
function resetJoinUI() {
  const go = document.getElementById('joinGo'); if (go) go.disabled = false;
  const w = document.getElementById('joinReplyWrap'); if (w) w.style.display = 'none';
}
function cancelJoin() {
  clearTimeout(joinTimer);
  if (joinLink) { joinLink.close(); }
  joinLink = null; net.hostConn = null;
  if (net.phase === 'joining') net.phase = 'idle';
}
async function guestStartJoin(raw) {
  cancelJoin();
  const { link, code } = await createReply(raw);   // throws a readable error for bad codes
  net.isHost = false; net.phase = 'joining';
  joinLink = link; net.hostConn = link;
  link.on('open', () => {
    clearTimeout(joinTimer);
    netSendToHost({ t: 'hello', token: MY_TOKEN, name: savedOrTypedName() });
  });
  link.on('data', msg => { guestReconnectAttempts = 0; guestOnHostMessage(msg); });
  link.on('close', () => {
    if (net.phase === 'joining') {
      cancelJoin(); resetJoinUI();
      setJoinStatus('Connection failed. Ask the host for a fresh invite and try again.');
    } else guestOnHostClosed();
  });
  const rw = document.getElementById('joinReplyWrap');
  const rb = document.getElementById('joinReply');
  if (rw && rb) { rb.value = code; rw.style.display = ''; }
  const cb = document.getElementById('joinCopy');
  if (cb) cb.onclick = e => copyText(code, e.target, '📋 Copy reply');
  setJoinStatus('2 · Send this reply to the host. Waiting for them to connect…');
  joinTimer = setTimeout(() => {
    if (net.phase === 'joining') {
      cancelJoin(); resetJoinUI();
      setJoinStatus('Timed out. Ask the host for a fresh invite and try again.');
    }
  }, 180000);
}

function leaveRoom() {
  cancelJoin();
  if (inviteState && inviteState.link) { try { inviteState.link.close(); } catch(e){} }
  inviteState = null; inviteEl.innerHTML = '';
  if (net.hostConn) { try { net.hostConn.close(); } catch(e){} }
  for (const tok in net.conns) { try { net.conns[tok].close(); } catch(e){} }
  net.hostConn = null; net.conns = {}; net.peer = null;
  net.phase = 'idle'; net.isHost = false; net.roomCode = ''; net.mySlot = -1;
  onlinePlayers = []; chatLog = []; unreadChat = 0;
  chatBadge.classList.remove('show');
  chatFloat.classList.remove('show');
  chatToggle.classList.remove('show');
}

function onHostDisconnect() {
  if (net.isHost) return;
  attemptGuestReconnect();
}

// Without a server a lost link can't be re-made automatically: the host sends a new invite.
function attemptGuestReconnect() {
  pushNotification('Connection to the host was lost. Ask the host for a new invite to rejoin.', 'danger', 5000);
  setTimeout(() => { leaveRoom(); gameState = 'menu'; showMenu(); }, 1200);
}

function hostOnGuestMessage(conn, msg) {
  if (!msg || !msg.t) return;

  if (msg.t === 'hello') {
    const token = String(msg.token || '').slice(0, 40);
    const name  = String(msg.name || 'Player').slice(0, 20);
    const existing = onlinePlayers.find(p => p.token === token);
    
    if (existing) {
      if (net.conns[token]) {
        try { net.conns[token].close(); } catch(e){}
        delete net.conns[token];
      }
      existing.connected = true;
      existing.disconnectedAt = null;
      if (name) existing.name = name;
      net.conns[token] = conn;
      conn.metadata = { token };
      netSendTo(conn, buildWelcomePacket(existing));
      hostBroadcastLobby();
      hostNotifyAll(`${existing.name} reconnected`, 'join');
      addChat({ sys: true, text: `${existing.name} reconnected` });
      return;
    }
    
    if (onlinePlayers.length >= 10) {
      netSendTo(conn, { t: 'reject', reason: 'Room is full (10 max).' });
      setTimeout(() => { try { conn.close(); } catch(e){} }, 100);
      return;
    }
    const slot = onlinePlayers.length;
    const isSpectator = (gameState !== 'menu' && gameState !== 'matchend');
    const p = {
      slot, token, name: name || ('P' + (slot + 1)),
      ready: false, connected: true, spectator: isSpectator,
      isHost: false, disconnectedAt: null
    };
    onlinePlayers.push(p);
    net.conns[token] = conn;
    conn.metadata = { token };
    if (onlineScores.length <= slot) onlineScores.push(0);
    netSendTo(conn, buildWelcomePacket(p));
    hostBroadcastLobby();
    if (isSpectator) {
      hostNotifyAll(`${p.name} joined as spectator`, 'join');
      addChat({ sys: true, text: `${p.name} joined as spectator` });
    } else {
      hostNotifyAll(`${p.name} joined the room`, 'join');
      addChat({ sys: true, text: `${p.name} joined` });
    }
    return;
  }

  const token = conn.metadata && conn.metadata.token;
  const me = onlinePlayers.find(p => p.token === token);
  if (!me) return;

  switch (msg.t) {
    case 'ready':
      if (gameState !== 'menu' || me.spectator) return;
      const was = me.ready;
      me.ready = !!msg.ready;
      if (was !== me.ready) {
        hostBroadcastLobby();
        if (!me.ready) pushNotification(`${me.name} is no longer ready`, 'info');
      }
      break;
    case 'chat':
      addChat({ name: me.name, text: String(msg.text || '').slice(0, 200) });
      hostBroadcastChat({ name: me.name, text: String(msg.text || '').slice(0, 200) });
      break;
    case 'flick':
      if (mode === 'online' && gameState === 'aiming' && turn === me.slot) {
        hostApplyGuestFlick(me.slot, msg);
      }
      break;
    case 'bye':
      hostRemovePlayer(me, 'left the room');
      break;
  }
}

function buildWelcomePacket(p) {
  return {
    t: 'welcome', room: net.roomCode, slot: p.slot, name: p.name, isSpectator: p.spectator,
    players: onlinePlayers.map(publicPlayer),
    rounds: onlineRounds, roundsOverridden: onlineRoundsOverridden,
    scores: onlineScores.slice(), round: roundIndex,
    turnSlot: (mode === 'online') ? turn : -1,
    remainingMs: (mode === 'online' && gameState === 'aiming') ? Math.max(0, turnDeadline - performance.now()) : 0,
    phase: gameState === 'menu' ? 'lobby' : (gameState === 'matchend' ? 'ended' : 'playing'),
    gameState: gameState,
    pens: (gameState !== 'menu' && pens.length) ? serializePens(pens) : null,
  };
}

function hostOnConnClosed(conn) {
  const token = conn.metadata && conn.metadata.token;
  if (!token) return;
  const me = onlinePlayers.find(p => p.token === token);
  if (!me) return;
  
  if (!me.connected) return;
  me.connected = false;
  me.disconnectedAt = performance.now();
  
  hostBroadcastLobby();
  hostNotifyAll(`${me.name} disconnected`, 'warn');
  addChat({ sys: true, text: `${me.name} disconnected` });

  const capturedToken = token;
  setTimeout(() => {
    const still = onlinePlayers.find(x => x.token === capturedToken);
    if (still && !still.connected && still.disconnectedAt && performance.now() - still.disconnectedAt >= DISCONNECT_GRACE - 200) {
      hostRemovePlayer(still, 'was removed (disconnected)');
    }
  }, DISCONNECT_GRACE + 200);
}

function hostRemovePlayer(me, why) {
  if (!me) return;
  if (net.conns[me.token]) {
    try { net.conns[me.token].close(); } catch(e){}
    delete net.conns[me.token];
  }
  
  const slotToRemove = me.slot;
  const wasInGame = (mode === 'online' && ['aiming', 'moving', 'roundend', 'ai'].includes(gameState));
  
  const idx = onlinePlayers.findIndex(p => p.slot === slotToRemove);
  if (idx >= 0) onlinePlayers.splice(idx, 1);
  onlinePlayers.forEach((p, i) => { p.slot = i; });
  
  hostBroadcastLobby();
  hostNotifyAll(`${me.name} ${why}`, 'leave');
  addChat({ sys: true, text: `${me.name} ${why}` });
  
  if (wasInGame) {
    const newPens = [];
    for (let i = 0; i < pens.length; i++) {
      if (i === slotToRemove) continue;
      const p = pens[i];
      if (p) {
        p.index = newPens.length;
        p.style = PALETTE[p.index % PALETTE.length];
        p._k = undefined;
      }
      newPens.push(p);
    }
    pens = newPens;
    playerCount = pens.length;
    
    onlineScores.splice(slotToRemove, 1);
    score.splice(slotToRemove, 1);
    
    if (turn === slotToRemove) {
      let next = -1;
      for (let k = 0; k < pens.length; k++) {
        if (pens[k] && !pens[k].out) {
          next = k;
          break;
        }
      }
      turn = next >= 0 ? next : 0;
    } else if (turn > slotToRemove) {
      turn--;
    }
    
    if (playerCount <= 1) {
      gameState = 'matchend';
      roundMsg = `${me.name} disconnected. Match ended.`;
      roundMsgColor = '#fca5a5';
      
      netBroadcast({ 
        t: 'matchEndDisconnect', 
        name: me.name,
        scores: onlineScores.slice()
      });
      
      showMatchEndDisconnect(me.name);
      return;
    }
    
    netBroadcast({
      t: 'removePlayer',
      slot: slotToRemove,
      pens: serializePens(pens),
      scores: onlineScores.slice(),
      turn: turn
    });
    
    if (gameState === 'aiming') {
      turnStartTime = performance.now();
      turnDeadline = turnStartTime + TURN_MS;
      netBroadcast({
        t: 'turnBegin', round: roundIndex, slot: turn,
        remainingMs: TURN_MS, pens: serializePens(pens)
      });
    }
  }
}

function publicPlayer(p) {
  return { slot: p.slot, name: p.name, ready: p.ready, connected: p.connected, spectator: p.spectator, isHost: p.isHost };
}

function recalcRounds() {
  if (onlineRoundsOverridden) return;
  onlineRounds = defaultRoundsFor(onlinePlayers.filter(p => !p.spectator).length);
}

function hostBroadcastLobby() {
  if (gameState === 'menu') recalcRounds();
  netBroadcast({
    t: 'lobby',
    players: onlinePlayers.map(publicPlayer),
    rounds: onlineRounds,
    roundsOverridden: onlineRoundsOverridden
  });
  paintLobby();
}

function hostSetRounds(n) {
  if (!net.isHost) return;
  n = clamp(n, MIN_ROUNDS, MAX_SELECTABLE_ROUNDS);
  if (n === onlineRounds) return;
  onlineRounds = n;
  onlineRoundsOverridden = true;
  hostBroadcastLobby();
  hostNotifyAll(`Host set rounds to ${n}`, 'info');
  addChat({ sys: true, text: `Host set rounds to ${n}` });
}

function hostBroadcastChat(line) {
  netBroadcast({ t: 'chat', name: line.name, text: line.text, sys: !!line.sys });
}
function hostBroadcastTurnBegin() {
  netBroadcast({
    t: 'turnBegin', round: roundIndex, slot: turn,
    remainingMs: TURN_MS, pens: serializePens(pens)
  });
}
function hostBroadcastApplyFlick(slot, msg) {
  netBroadcast({
    t: 'applyFlick', slot,
    nx: msg.nx, ny: msg.ny, speed: msg.speed, hx: msg.hx, hy: msg.hy
  });
}
function hostBroadcastRoundEnd(winner) {
  netBroadcast({ t: 'roundEnd', winner, scores: onlineScores.slice() });
}
function hostBroadcastMatchEnd() {
  netBroadcast({ t: 'matchEnd', scores: onlineScores.slice() });
}

function guestOnHostMessage(msg) {
  if (!msg || !msg.t) return;

  switch (msg.t) {
    case 'reject':
      pushNotification(msg.reason || 'Cannot join.', 'danger', 3000);
      leaveRoom();
      if (gameState === 'menu') showMenu();
      return;
    case 'notify':
      pushNotification(msg.text, msg.type || 'info', msg.duration || NOTIFY_MS);
      return;
    case 'welcome': {
      net.phase = 'lobby';
      net.roomCode = msg.room || net.roomCode;
      net.mySlot = msg.slot;
      spectating = !!msg.isSpectator;
      onlinePlayers = msg.players.map(publicPlayer);
      onlineRounds = msg.rounds;
      onlineRoundsOverridden = !!msg.roundsOverridden;
      onlineScores = msg.scores || [];
      

      if (msg.phase === 'playing' && msg.pens) {
        mode = 'online';
        playerCount = onlinePlayers.length;
        score = onlineScores.slice();
        while (score.length < playerCount) score.push(0);
        roundIndex = msg.round || 0;
        totalRounds = onlineRounds;
        pens = deserializePens(msg.pens, playerCount);
        turn = msg.turnSlot != null ? msg.turnSlot : -1;
        turnStartTime = performance.now();
        turnDeadline = turnStartTime + (msg.remainingMs || 0);
        
        gameState = msg.gameState || 'aiming'; 
        
        overlay.classList.remove('show');
        chatToggle.classList.add('show');
        chatFloat.classList.remove('show');
        unreadChat = 0;
        chatBadge.classList.remove('show');
      } else if (msg.phase === 'ended') {
        mode = 'online';
        playerCount = onlinePlayers.length;
        score = onlineScores.slice();
        while (score.length < playerCount) score.push(0);
        totalRounds = onlineRounds;
        roundIndex = Math.max(0, totalRounds - 1);
        gameState = 'matchend';
        overlay.classList.remove('show');
        chatToggle.classList.add('show');
        showMatchEnd();
      } else {
        paintLobby();
      }
      return;
    }
    case 'start': {
      setSeed(msg.seed);
      totalRounds = msg.rounds;
      playerCount = msg.players.length;
      onlinePlayers = msg.players.map(publicPlayer);
      onlineScores = msg.scores || [];
      score = onlineScores.slice();
      while (score.length < playerCount) score.push(0);
      roundIndex = 0;
      spectating = false;
      mode = 'online';
      gameState = 'aiming';
      overlay.classList.remove('show');
      chatToggle.classList.add('show');
      chatFloat.classList.remove('show');
      unreadChat = 0;
      chatBadge.classList.remove('show');
      return;
    }
    case 'lobby':
      onlinePlayers = msg.players.map(publicPlayer);
      onlineRounds = msg.rounds;
      onlineRoundsOverridden = !!msg.roundsOverridden;
      
      const me = onlinePlayers.find(p => p.token === MY_TOKEN);
      if (me) {
        net.mySlot = me.slot;
        spectating = me.spectator;
      }
      
      if (gameState === 'matchend') {
        gameState = 'menu';
        overlay.classList.add('show');
        chatToggle.classList.remove('show');
        chatFloat.classList.remove('show');
        addChat({ sys: true, text: 'Host started a new lobby.' });
      }
      if (gameState === 'menu') paintLobby();
      return;
    case 'removePlayer':
      onlineScores = msg.scores || onlineScores;
      score = onlineScores.slice();
      pens = deserializePens(msg.pens, msg.pens.length);
      playerCount = pens.length;
      turn = msg.turn;
      if (gameState === 'aiming') {
        turnStartTime = performance.now();
        turnDeadline = turnStartTime + TURN_MS;
      }
      return;
    case 'matchEndDisconnect':
      onlineScores = msg.scores || onlineScores;
      score = onlineScores.slice();
      gameState = 'matchend';
      showMatchEndDisconnect(msg.name);
      return;
    case 'chat':
      addChat({ name: msg.name, text: msg.text, sys: !!msg.sys });
      return;
    case 'turnBegin':
      roundIndex = msg.round;
      turn = msg.slot;
      turnStartTime = performance.now();
      turnDeadline = turnStartTime + (msg.remainingMs || TURN_MS);
      {
        const old = pens;
        pens = deserializePens(msg.pens, playerCount);
        for (let i = 0; i < pens.length; i++) {
          const o = old[i], n = pens[i];
          if (!o || !n || o.out || n.out) continue;
          const dx = o.x - n.x, dy = o.y - n.y;
          let da = o.angle - n.angle;
          da = Math.atan2(Math.sin(da), Math.cos(da));
          if (Math.abs(dx) + Math.abs(dy) < 80) { n.ox = dx; n.oy = dy; n.oa = da; }
        }
      }
      gameState = 'aiming';
      roundOver = false;
      settleTimer = 0;
      drag = null;
      return;
    case 'applyFlick':
      if (pens[msg.slot]) {
        flick(pens[msg.slot], { x: msg.nx, y: msg.ny }, msg.speed, { x: msg.hx, y: msg.hy });
        sfxFlick(msg.speed / MAX_SPEED);
      }
      gameState = 'moving';
      settleTimer = 0;
      return;
    case 'timeout':
      gameState = 'moving';
      settleTimer = 0;
      return;
    case 'roundEnd':
      onlineScores = msg.scores || onlineScores;
      score = onlineScores.slice();
      while (score.length < playerCount) score.push(0);
      gameState = 'roundend';
      roundEndTimer = 2.0;
      roundOver = true;
      drag = null;
      if (msg.winner >= 0) {
        roundMsg = `${playerName(msg.winner)} WINS THE ROUND`;
        roundMsgColor = (pens[msg.winner] ? pens[msg.winner].style.light : '#fff');
        sfxTone(660, 0.18, 0.09, 'sine');
      } else {
        roundMsg = 'DRAW';
        roundMsgColor = '#fbbf24';
      }
      return;
    case 'matchEnd':
      onlineScores = msg.scores || onlineScores;
      score = onlineScores.slice();
      while (score.length < playerCount) score.push(0);
      gameState = 'matchend';
      showMatchEnd();
      return;
    case 'kick':
      pushNotification('You were removed from the room.', 'danger', 3000);
      leaveRoom();
      gameState = 'menu';
      showMenu();
      return;
  }
}
function guestOnHostClosed() { onHostDisconnect(); }

function hostStartMatch() {
  if (!net.isHost) return;
  const waiting = onlinePlayers.filter(p => !p.isHost && !p.spectator && !p.ready);
  if (waiting.length > 0) return;
  const realPlayers = onlinePlayers.filter(p => !p.spectator);
  if (realPlayers.length < 2) return;

  let cursor = 0;
  for (const p of onlinePlayers) { p.slot = cursor++; p.ready = true; }
  onlineScores = new Array(onlinePlayers.length).fill(0);
  score = onlineScores.slice();
  playerCount = onlinePlayers.length;
  totalRounds = onlineRounds;
  roundIndex = 0;
  tiebreakPlayers = [];
  tiebreakRoundsPlayed = 0;
  spectating = false;

  const seed = (Math.random() * 1e9) | 0;
  setSeed(seed);
  breakerOrder = buildBreakerOrderFor(
    Array.from({length: playerCount}, (_, i) => i), totalRounds
  );

  netBroadcast({
    t: 'start', seed, rounds: totalRounds,
    players: onlinePlayers.map(publicPlayer),
    scores: onlineScores.slice(),
    turnSlot: breakerOrder[0], remainingMs: TURN_MS,
  });

  mode = 'online';
  net.phase = 'playing';
  overlay.classList.remove('show');
  chatToggle.classList.add('show');
  chatFloat.classList.remove('show');
  startRound();
  hostNotifyAll(`Match starting — ${totalRounds} rounds`, 'info', 2200);
}

function hostApplyGuestFlick(slot, msg) {
  if (gameState !== 'aiming') return;
  if (performance.now() > turnDeadline) { hostTimeout(); return; }
  const pen = pens[slot];
  if (!pen || pen.out) return;
  flick(pen, { x: msg.nx, y: msg.ny }, msg.speed, { x: msg.hx, y: msg.hy });
  sfxFlick(msg.speed / MAX_SPEED);
  gameState = 'moving';
  settleTimer = 0;
  hostBroadcastApplyFlick(slot, msg);
}

function hostTimeout() {
  if (gameState !== 'aiming') return;
  const who = playerName(turn);
  netBroadcast({ t: 'timeout', slot: turn });
  hostNotifyAll(`${who} didn't shoot — turn skipped`, 'warn');
  addChat({ sys: true, text: `${who} timed out` });
  gameState = 'moving';
  settleTimer = 0;
  setTimeout(() => {
    if (gameState !== 'moving') return;
    if (allSettled(pens)) { settleTimer = 0; resolveShot(); }
  }, 200);
}

function resetPens() {
  const cx = DESK.x + DESK.w / 2;
  const cy = DESK.y + DESK.h / 2;
  const active = activePlayersForRound();
  const n = active.length;
  pens = new Array(playerCount).fill(null);
  sparks = [];

  if (n === 2) {
    const off = rand(-70, 70);
    const a0 = active[0], a1 = active[1];
    pens[a0] = makePen(DESK.x + 170, cy + off, rand(-0.25, 0.25), a0, mode === 'cpu' && a0 === 1);
    pens[a1] = makePen(DESK.x + DESK.w - 170, cy - off, Math.PI + rand(-0.25, 0.25), a1, mode === 'cpu' && a1 === 1);
  } else {
    const R = Math.min(DESK.w, DESK.h) * 0.34;
    const angOff = rand(0, Math.PI * 2);
    for (let k = 0; k < n; k++) {
      const i = active[k];
      const a = angOff + (k / n) * Math.PI * 2;
      const px = cx + Math.cos(a) * R;
      const py = cy + Math.sin(a) * R;
      const penAng = a + Math.PI + rand(-0.35, 0.35);
      pens[i] = makePen(px, py, penAng, i, mode === 'cpu' && i === 1);
    }
  }
  for (let i = 0; i < playerCount; i++) {
    if (!pens[i]) {
      const p = makePen(-1000, -1000, 0, i, false);
      p.out = true; p.alpha = 0;
      pens[i] = p;
    }
  }
}

function beginMatch() {
  score = new Array(playerCount).fill(0);
  roundIndex = 0;
  totalRounds = selectedRounds;
  tiebreakPlayers = [];
  tiebreakRoundsPlayed = 0;
  tiebreakBreakerOrder = [];
  const allIdxs = Array.from({length: playerCount}, (_, i) => i);
  breakerOrder = buildBreakerOrderFor(allIdxs, totalRounds);
  startRound();
}

function currentBreaker() {
  if (inTiebreak()) {
    return tiebreakBreakerOrder[Math.min(tiebreakRoundsPlayed, tiebreakBreakerOrder.length - 1)];
  }
  return breakerOrder[Math.min(roundIndex, breakerOrder.length - 1)];
}

function startRound() {
  resetPens();
  roundOver = false;
  settleTimer = 0;
  acc = 0;
  drag = null;
  turn = currentBreaker();

  if (pens[turn] && pens[turn].isCpu) {
    gameState = 'ai';
    aiTimer = 0.65;
  } else {
    gameState = 'aiming';
  }

  if (mode === 'online' && net.isHost) {
    turnStartTime = performance.now();
    turnDeadline = turnStartTime + TURN_MS;
    hostBroadcastTurnBegin();
  }
}

function endRound(winnerIdx) {
  gameState = 'roundend';
  roundEndTimer = 2.0;
  roundOver = true;
  drag = null;

  if (winnerIdx >= 0) {
    score[winnerIdx] = (score[winnerIdx] || 0) + 1;
    if (mode === 'cpu') roundMsg = winnerIdx === 0 ? 'YOU WIN THE ROUND' : 'CPU WINS THE ROUND';
    else roundMsg = `${playerName(winnerIdx)} WINS THE ROUND`;
    roundMsgColor = (pens[winnerIdx] ? pens[winnerIdx].style.light : '#fff');
    sfxTone(660, 0.18, 0.09, 'sine');
    setTimeout(() => sfxTone(990, 0.3, 0.08, 'sine'), 110);
  } else {
    roundMsg = 'DRAW';
    roundMsgColor = '#fbbf24';
    sfxTone(420, 0.25, 0.07, 'triangle');
  }

  if (mode === 'online' && net.isHost) {
    onlineScores = score.slice();
    hostBroadcastRoundEnd(winnerIdx);
  }
}

function afterRound() {
  if (inTiebreak()) {
    tiebreakRoundsPlayed++;
    const leaders = leadersIn(tiebreakPlayers);
    if (leaders.length === 1 || tiebreakRoundsPlayed >= MAX_TIEBREAK) {
      gameState = 'matchend';
      if (mode === 'online' && net.isHost) hostBroadcastMatchEnd();
      showMatchEnd();
      return;
    }
    startRound();
    return;
  }
  roundIndex++;
  if (roundIndex >= totalRounds) {
    const allIdxs = Array.from({length: playerCount}, (_, i) => i);
    const leaders = leadersIn(allIdxs);
    if (leaders.length === 1) {
      gameState = 'matchend';
      if (mode === 'online' && net.isHost) hostBroadcastMatchEnd();
      showMatchEnd();
      return;
    }
    tiebreakPlayers = leaders.slice();
    tiebreakRoundsPlayed = 0;
    tiebreakBreakerOrder = buildBreakerOrderFor(tiebreakPlayers, MAX_TIEBREAK);
    startRound();
    return;
  }
  startRound();
}

function resolveShot() {
  const alive = [];
  pens.forEach((p, i) => { if (!p.out) alive.push(i); });
  if (alive.length === 0) { endRound(-1); return; }
  if (alive.length === 1) { endRound(alive[0]); return; }
  const next = nextAliveAfter(turn);
  if (next === -1) { endRound(-1); return; }
  turn = next;

  if (pens[turn] && pens[turn].isCpu) {
    gameState = 'ai';
    aiTimer = 0.65;
  } else {
    gameState = 'aiming';
  }

  if (mode === 'online' && net.isHost) {
    turnStartTime = performance.now();
    turnDeadline = turnStartTime + TURN_MS;
    hostBroadcastTurnBegin();
  }
}

function showMatchEnd() {
  const allIdxs = Array.from({length: playerCount}, (_, i) => i);
  const leaders = leadersIn(allIdxs);
  let title;
  if (leaders.length > 1) title = 'DRAW';
  else {
    const w = leaders[0];
    if (mode === 'cpu') title = w === 0 ? 'YOU WIN!' : 'CPU WINS';
    else if (mode === 'online') title = `${playerName(w)} WINS`;
    else title = `PLAYER ${w + 1} WINS`;
  }

  const ranked = score.map((s, i) => ({ i, s })).sort((a, b) => b.s - a.s || a.i - b.i);
  const rows = ranked.map(r => {
    const p = pens[r.i];
    const name = playerName(r.i);
    const isWinner = leaders.length === 1 && r.i === leaders[0];
    const color = p ? p.style.body : '#94a3b8';
    return `<div class="standRow${isWinner ? ' winner' : ''}">
      <span class="dot" style="background:${color}"></span>
      <span>${escapeHtml(name)}</span>
      <span class="standScore">${r.s}</span>
    </div>`;
  }).join('');

  const iAmHost = (mode === 'online' && net.isHost);
  let btns;
  if (mode === 'online') {
    btns = iAmHost
      ? `<button class="btn" id="againBtn">NEW MATCH</button><button class="btn secondary" id="homeBtn">LEAVE</button>`
      : `<button class="btn secondary" id="homeBtn">LEAVE</button>`;
  } else {
    btns = `<button class="btn" id="againBtn">PLAY AGAIN</button><button class="btn secondary" id="homeBtn">HOME</button>`;
  }

  panel.innerHTML = `
    <h1>${escapeHtml(title)}</h1>
    <div class="standings">${rows}</div>
    <div class="endBtns">${btns}</div>
    <p class="hint"><b>Tip:</b> broadside flicks hit hard · end-on flicks are weak.</p>
  `;
  overlay.classList.add('show');

  if (iAmHost) {
    document.getElementById('againBtn').onclick = () => {
      for (const p of onlinePlayers) { p.spectator = false; p.ready = p.isHost; }
      onlineScores = [];
      gameState = 'menu';
      mode = 'online';
      net.phase = 'lobby';
      chatToggle.classList.remove('show');
      onlineRounds = defaultRoundsFor(onlinePlayers.length);
      onlineRoundsOverridden = false;
      hostBroadcastLobby();
      paintLobby();
    };
  }
  const homeBtn = document.getElementById('homeBtn');
  if (homeBtn) homeBtn.onclick = () => {
    leaveRoom();
    gameState = 'menu';
    chatToggle.classList.remove('show');
    showMenu();
  };
}

function showMatchEndDisconnect(name) {
  const iAmHost = (mode === 'online' && net.isHost);
  
  const ranked = score.map((s, i) => ({ i, s })).sort((a, b) => b.s - a.s || a.i - b.i);
  const rows = ranked.map(r => {
    const p = pens[r.i];
    const pName = playerName(r.i);
    const color = p ? p.style.body : '#94a3b8';
    return `<div class="standRow">
      <span class="dot" style="background:${color}"></span>
      <span>${escapeHtml(pName)}</span>
      <span class="standScore">${r.s}</span>
    </div>`;
  }).join('');
  
  let btns = iAmHost 
    ? `<button class="btn" id="againBtn">BACK TO ROOM</button>`
    : `<button class="btn secondary" id="homeBtn">LEAVE</button>`;
    
  panel.innerHTML = `
    <h1 style="font-size:clamp(24px,4vw,40px);color:#fca5a5;background:none;-webkit-text-fill-color:#fca5a5">OPPONENT DISCONNECTED</h1>
    <p class="sub">${escapeHtml(name)} disconnected. Match ended.</p>
    <div class="standings">${rows}</div>
    <div class="endBtns">${btns}</div>
  `;
  overlay.classList.add('show');
  
  if (iAmHost) {
    document.getElementById('againBtn').onclick = () => {
      for (const p of onlinePlayers) { p.spectator = false; p.ready = p.isHost; }
      onlineScores = [];
      gameState = 'menu';
      mode = 'online';
      net.phase = 'lobby';
      chatToggle.classList.remove('show');
      onlineRounds = defaultRoundsFor(onlinePlayers.length);
      onlineRoundsOverridden = false;
      hostBroadcastLobby();
      paintLobby();
    };
  }
  const homeBtn = document.getElementById('homeBtn');
  if (homeBtn) homeBtn.onclick = () => {
    leaveRoom();

    chatToggle.classList.remove('show');
